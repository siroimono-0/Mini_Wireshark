           L 340 50
           L 282 94
           L 282 68
           C 238 67 205 75 176 90
           C 208 61 242 54 282 54
           Z"
        fill="url(#arrowGrad)"/>

  <!-- text -->
  <text x="256" y="276"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="86"
