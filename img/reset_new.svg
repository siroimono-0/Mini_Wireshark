<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arrowGrad" x1="64" y1="72" x2="432" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b7f5b0"/>
      <stop offset="100%" stop-color="#67e0c4"/>
