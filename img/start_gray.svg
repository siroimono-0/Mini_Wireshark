<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D3D3D3"/>
      <stop offset="100%" stop-color="#D3D3D3"/>
    </linearGradient>
    <linearGradient id="bgInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D3D3D3"/>
      <stop offset="100%" stop-color="#D3D3D3"/>
    </linearGradient>
    <linearGradient id="finFill" x1="0.12" y1="0.12" x2="0.9" y2="0.92">
      <stop offset="0%" stop-color="#D3D3D3"/>
      <stop offset="42%" stop-color="#D3D3D3"/>
      <stop offset="100%" stop-color="#D3D3D3"/>
    </linearGradient>
    <linearGradient id="finHighlight" x1="0.1" y1="0.05" x2="0.72" y2="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#cfe3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14407c" flood-opacity="0.28"/>
    </filter>
    <clipPath id="innerClip">
      <rect x="41" y="41" width="430" height="430" rx="62" ry="62"/>
    </clipPath>
    <pattern id="bits" width="68" height="30" patternUnits="userSpaceOnUse">
      <text x="0" y="21" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0c3a87" fill-opacity="0.26" letter-spacing="1.2">010011 00001010</text>
    </pattern>
  </defs>

  <!-- transparent background outside the icon -->
  <g filter="url(#shadow)">
    <rect x="18" y="18" width="476" height="476" rx="88" ry="88" fill="url(#bgOuter)"/>
    <rect x="41" y="41" width="430" height="430" rx="62" ry="62" fill="url(#bgInner)"/>
    <rect x="41" y="41" width="430" height="430" rx="62" ry="62" fill="url(#bits)" opacity="0.95"/>

    <g clip-path="url(#innerClip)">
      <path d="M81 390
               C112 260, 194 150, 277 94
               C334 55, 393 46, 433 66
               C420 95, 407 123, 397 163
               C378 241, 376 312, 407 393
               C336 444, 258 431, 186 392
               C153 374, 118 370, 81 390 Z"
            fill="none"
            stroke="#ffffff"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <path d="M89 384
               C120 262, 199 158, 279 104
               C330 70, 383 60, 421 76
               C409 103, 398 129, 389 164
               C369 242, 369 309, 398 388
               C333 431, 262 421, 194 388
               C158 370, 125 366, 89 384 Z"
            fill="url(#finFill)"/>

      <path d="M117 358
               C136 275, 199 183, 274 128
               C314 99, 353 86, 387 87
               C336 113, 289 175, 258 240
               C228 304, 213 340, 117 358 Z"
            fill="url(#finHighlight)"/>
    </g>
  </g>
</svg>
